services:
  - type: web
    name: stock-scanner
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 280 -b 0.0.0.0:$PORT app:app
    envVars:
      - key: SCANNER_UNIVERSE
        value: sp500
      - key: SCANNER_TOP
        value: "40"
      - key: SCANNER_MIN_PRICE
        value: "5.0"
      - key: SCANNER_MIN_AVG_VOLUME
        value: "300000"
      - key: SCANNER_AUTO_REFRESH_SECONDS
        value: "1200"
